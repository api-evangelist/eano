name: Eano

image: https://cdn.prod.website-files.com/670d5a126bda66dca6cdabeb/672174e1cad37880075a2860_webclip.jpg

description: Eano provides an all‑in‑one residential construction project management platform that combines AI‑driven estimating, sales, project
  tracking, and financial tools. The SaaS solution helps general contractors, remodelers, and home‑builders manage estimates, proposals, change
  orders, vendor management, and client communication in a single cloud‑based system. Features include AI‑assisted takeoffs, video estimations,
  CRM, budgeting, integrations with QuickBooks, and a client dashboard for real‑time project visibility.

